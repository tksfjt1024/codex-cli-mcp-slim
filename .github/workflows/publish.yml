name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-cli-mcp-slim
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job pushes, so the token is not left behind in the local
          # git config where every later step could reach it.
          persist-credentials: false

      - name: Check CHANGELOG describes this release
        # github-release runs this same script to build the body it publishes, but it
        # runs after the upload, and PyPI refuses a second upload of a version it
        # already holds. Failing here leaves nothing published; failing there would
        # leave a version on PyPI that cannot be released without a version bump.
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/changelog-section.sh "$TAG" > /dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches pyproject.toml's version
        # PyPI refuses a second upload of a version it already holds, so a tag pushed
        # without the version bump would publish the previous version's number with new
        # code, and the mismatch could not be corrected without another bump.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Run the test suite and linter before building
        # The CI workflow runs on pushes to main, but nothing forces a tag to come from a
        # commit that passed it. Running the same checks here keeps a red commit off PyPI.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Separate from `publish` so that `contents: write` — which the release API
    # requires — is not held by the job that builds and uploads the artifacts.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` below resolves the preceding tag, which the default
          # depth-1 checkout does not fetch.
          fetch-depth: 0
          # gh authenticates through GH_TOKEN and nothing here pushes, so this job's
          # write-scoped token stays out of the local git config.
          persist-credentials: false

      - name: Build release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/changelog-section.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          # --generate-notes would prepend a "What's Changed" list built from merged
          # PRs, and this repository commits to main without them.
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" \
              >> "$RUNNER_TEMP/notes.md"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG: $(git log -1 --format=%s "$TAG")" \
            --notes-file "$RUNNER_TEMP/notes.md"
